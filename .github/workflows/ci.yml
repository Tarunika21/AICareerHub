name: AICareerHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # =========================================================
  # BACKEND - BUILD AND TEST
  # =========================================================
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj

      - name: Build backend
        run: dotnet build Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Backend/AICareerHub.API/AICareerHub.API.Tests/AICareerHub.API.Tests.csproj --configuration Release


  # =========================================================
  # FRONTEND - BUILD
  # =========================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/aicareerhub-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/aicareerhub-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  # =========================================================
  # BACKEND - DEPLOY TO AWS ELASTIC BEANSTALK
  # =========================================================
  deploy-backend:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: us-east-1
      EB_APPLICATION_NAME: AICareerHub
      EB_ENVIRONMENT_NAME: aicareerhub-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Publish backend
        run: |
          dotnet publish Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj \
            --configuration Release \
            --output ./publish

      - name: Create deployment package
        run: |
          cd publish
          zip -r ../deployment.zip .

      - name: Generate deployment version
        run: echo "VERSION_LABEL=aicareerhub-${GITHUB_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Find Elastic Beanstalk S3 bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "${AWS_REGION}" \
            --query 'S3Bucket' \
            --output text)

          echo "EB_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Elastic Beanstalk bucket: $BUCKET"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deployment.zip \
            "s3://${EB_BUCKET}/${VERSION_LABEL}.zip" \
            --region "${AWS_REGION}"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${EB_BUCKET}",S3Key="${VERSION_LABEL}.zip" \
            --region "${AWS_REGION}"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --region "${AWS_REGION}"

      - name: Wait for Elastic Beanstalk deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}"

      - name: Verify Elastic Beanstalk health
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environments[0].[Status,Health,HealthStatus,VersionLabel]' \
            --output table


  # =========================================================
  # FRONTEND - DEPLOY TO AWS S3
  # =========================================================
  deploy-frontend:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: aicareerhub-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/aicareerhub-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/aicareerhub-ui
        run: npm ci

      - name: Build Angular application
        working-directory: Frontend/aicareerhub-ui
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Angular build output
        run: |
          echo "Angular dist contents:"
          find Frontend/aicareerhub-ui/dist -maxdepth 3 -type f | head -50

      - name: Deploy frontend to S3
        run: |
          aws s3 sync \
            Frontend/aicareerhub-ui/dist/aicareerhub-ui/browser/ \
            "s3://${S3_BUCKET}/browser/" \
            --delete \
            --region "${AWS_REGION}"