name: AICareerHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj

      - name: Build backend
        run: dotnet build Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Backend/AICareerHub.API/AICareerHub.API.Tests/AICareerHub.API.Tests.csproj --configuration Release

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/aicareerhub-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/aicareerhub-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build