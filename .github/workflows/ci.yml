name: AICareerHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # =========================================================
  # BACKEND - BUILD AND TEST
  # =========================================================
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj

      - name: Build backend
        run: dotnet build Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Backend/AICareerHub.API/AICareerHub.API.Tests/AICareerHub.API.Tests.csproj --configuration Release


  # =========================================================
  # FRONTEND - BUILD
  # =========================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/aicareerhub-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/aicareerhub-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  # =========================================================
  # DEPLOY BACKEND TO AWS ELASTIC BEANSTALK
  # =========================================================
  deploy-backend:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    # Deploy only when code is pushed/merged into main.
    # Pull requests will build and test but will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Authenticate to AWS using GitHub OIDC.
      # No AWS access key or secret key is stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Publish the ASP.NET Core application.
      - name: Publish backend
        run: >
          dotnet publish
          Backend/AICareerHub.API/AICareerHub.API/AICareerHub.API.csproj
          --configuration Release
          --output ./publish

      # Elastic Beanstalk requires a deployment bundle.
      - name: Create deployment package
        run: |
          cd publish
          zip -r ../aicareerhub-api.zip .

      # Every deployment needs a unique Elastic Beanstalk
      # application version label.
      - name: Generate version label
        run: echo "VERSION_LABEL=aicareerhub-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Determine the standard Elastic Beanstalk S3 bucket
      # for this AWS account and region.
      - name: Determine Elastic Beanstalk S3 bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="elasticbeanstalk-${{ vars.AWS_REGION }}-${ACCOUNT_ID}"

          echo "EB_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      # Upload the published application bundle.
      - name: Upload deployment package to S3
        run: |
          aws s3 cp aicareerhub-api.zip \
            "s3://${EB_BUCKET}/github-actions/${VERSION_LABEL}.zip"

      # Register the uploaded ZIP as a new application version.
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "AICareerHub" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${EB_BUCKET}",S3Key="github-actions/${VERSION_LABEL}.zip"

      # Deploy that version to the existing environment.
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "aicareerhub-api" \
            --version-label "${VERSION_LABEL}"

      # Wait until Elastic Beanstalk finishes the deployment.
      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "aicareerhub-api"

      # Print the final deployment status.
      - name: Verify environment health
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "aicareerhub-api" \
            --query "Environments[0].[Status,Health,VersionLabel]" \
            --output table